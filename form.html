<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Tap — Personnaliser votre Carte</title>
    <!-- Police Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-body: #FFFFFF;
            --bg-surface: #F8FAFC;
            --bg-card: #FFFFFF;
            --primary: #FF7A00;
            --primary-gradient: linear-gradient(135deg, #FF9432 0%, #FF7A00 50%, #E05300 100%);
            --primary-glow-strong: rgba(255, 122, 0, 0.25);
            --primary-glow: rgba(255, 122, 0, 0.12);
            --text-main: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --border-subtle: #E2E8F0;
            --border-hover: rgba(255, 122, 0, 0.4);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 28px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            width: 100%;
            padding: 16px 24px;
            backdrop-filter: blur(16px);
            background: rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid var(--border-subtle);
        }

        .nav-container {
            max-width: 1240px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 800;
            font-size: 1.15rem;
        }

        .logo-symbol {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--primary-gradient);
            display: grid;
            place-items: center;
            box-shadow: 0 4px 12px var(--primary-glow-strong);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .nav-link:hover {
            color: var(--primary);
        }

        .main-container {
            max-width: 760px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 24px 80px;
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .header-title-area {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 122, 0, 0.1);
            border: 1px solid rgba(255, 122, 0, 0.2);
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 auto;
        }

        .header-title-area h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .header-title-area p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* FORM CARD */
        .form-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 36px 32px;
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04);
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .form-section-title {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 8px;
            margin-bottom: 4px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-grid.full {
            grid-template-columns: 1fr;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            background: #F8FAFC;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--text-main);
            outline: none;
            transition: var(--transition);
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(255, 122, 0, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-gradient);
            color: #FFFFFF;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 999px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 20px var(--primary-glow-strong);
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(255, 122, 0, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        footer {
            margin-top: auto;
            border-top: 1px solid var(--border-subtle);
            background: var(--bg-surface);
            padding: 30px 24px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .secret-dot {
            cursor: default;
            user-select: none;
        }

        @media (max-width: 640px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .form-card {
                padding: 24px 18px;
            }
            .header-title-area h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER SANS LIEN NI BOUTON ADMIN -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-symbol">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 2L18 8L6 14L18 20L6 26"/>
                        <path d="M2 10h.01"/>
                        <path d="M2 14h.01"/>
                    </svg>
                </div>
                <span>Vision Tap</span>
            </a>

            <nav class="nav-links">
                <a href="templates.html" class="nav-link">← Changer de modèle</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        
        <div class="header-title-area">
            <span class="header-badge">Étape 2 sur 2</span>
            <h1>Vos Coordonnées Professionnelles</h1>
            <p>Remplissez vos informations qui seront automatiquement encodées dans votre carte NFC.</p>
        </div>

        <div class="form-card">
            <form id="profile-form" onsubmit="handleFormSubmit(event)">
                
                <input type="hidden" id="card-template" name="template" value="professional">

                <!-- 1. Informations Personnelles -->
                <div class="form-section-title">1. Identité & Contact</div>
                <div class="form-grid" style="margin-bottom: 20px;">
                    <div class="input-group">
                        <label for="full-name">Nom & Prénom *</label>
                        <input type="text" id="full-name" placeholder="ex: Karim Bennani" required>
                    </div>

                    <div class="input-group">
                        <label for="job-title">Profession / Titre *</label>
                        <input type="text" id="job-title" placeholder="ex: Directeur Commercial" required>
                    </div>

                    <div class="input-group">
                        <label for="company-name">Entreprise / Marque</label>
                        <input type="text" id="company-name" placeholder="ex: Vision Tap Studio">
                    </div>

                    <div class="input-group">
                        <label for="phone-number">Numéro WhatsApp / Téléphone *</label>
                        <input type="tel" id="phone-number" placeholder="+212 600 000 000" required>
                    </div>

                    <div class="input-group">
                        <label for="contact-email">Email professionnel *</label>
                        <input type="email" id="contact-email" placeholder="contact@exemple.ma" required>
                    </div>

                    <div class="input-group">
                        <label for="photo-url">Lien Photo de Profil (URL)</label>
                        <input type="url" id="photo-url" placeholder="https://image.png (optionnel)">
                    </div>
                </div>

                <!-- 2. Présentation & Bio -->
                <div class="form-section-title">2. Courte Présentation</div>
                <div class="form-grid full" style="margin-bottom: 20px;">
                    <div class="input-group">
                        <label for="bio-desc">À propos de vous / Slogan</label>
                        <textarea id="bio-desc" placeholder="Décrivez en 2 lignes votre expertise ou vos services..."></textarea>
                    </div>
                </div>

                <!-- 3. Liens & Réseaux Sociaux -->
                <div class="form-section-title">3. Liens & Réseaux Sociaux</div>
                <div class="form-grid" style="margin-bottom: 24px;">
                    <div class="input-group">
                        <label for="website-url">Site Web</label>
                        <input type="url" id="website-url" placeholder="https://monsite.ma">
                    </div>

                    <div class="input-group">
                        <label for="instagram-url">Lien Instagram</label>
                        <input type="url" id="instagram-url" placeholder="https://instagram.com/pseudo">
                    </div>

                    <div class="input-group">
                        <label for="linkedin-url">Lien LinkedIn</label>
                        <input type="url" id="linkedin-url" placeholder="https://linkedin.com/in/pseudo">
                    </div>

                    <div class="input-group">
                        <label for="location-city">Ville / Localisation</label>
                        <input type="text" id="location-city" placeholder="Casablanca, Maroc">
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn-submit">
                    Générer mon Profil & Enregistrer ma Carte →
                </button>
            </form>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 Vision Tap<span class="secret-dot" onclick="handleSecretAdmin()">.</span> Tous droits réservés.</p>
    </footer>

    <!-- SUPABASE LOGIQUE -->
    <script>
        const SUPABASE_URL = "https://vbywltvaiqvixjdiztkr.supabase.co";
        const SUPABASE_KEY = "sb_publishable_eKDcZHQoK8y8l4wbrGeApA_w5-Wc6Vx";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Récupérer le template depuis l'URL (?template=creative, etc.)
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const tmpl = params.get('template');
            if (tmpl) {
                document.getElementById('card-template').value = tmpl;
            }
        });

        async function handleFormSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.disabled = true;
            btn.textContent = "Génération de votre profil en cours...";

            const name = document.getElementById('full-name').value.trim();
            const profession = document.getElementById('job-title').value.trim();
            const company = document.getElementById('company-name').value.trim();
            const phone = document.getElementById('phone-number').value.trim();
            const email = document.getElementById('contact-email').value.trim();
            const photo = document.getElementById('photo-url').value.trim();
            const bio = document.getElementById('bio-desc').value.trim();
            const website = document.getElementById('website-url').value.trim();
            const instagram = document.getElementById('instagram-url').value.trim();
            const linkedin = document.getElementById('linkedin-url').value.trim();
            const city = document.getElementById('location-city').value.trim();
            const template = document.getElementById('card-template').value;

            // Création d'un slug unique pour l'URL du profil NFC
            const cleanName = name.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-');
            const randomCode = Math.random().toString(36).substring(2, 7);
            const slug = `${cleanName}-${randomCode}`;

            try {
                const { data, error } = await supabase
                    .from('profiles')
                    .insert([
                        {
                            name: name,
                            profession: profession,
                            company: company,
                            phone: phone,
                            email: email,
                            photo: photo || null,
                            bio: bio,
                            website: website,
                            instagram: instagram,
                            linkedin: linkedin,
                            city: city,
                            template: template,
                            slug: slug,
                            scans: 0
                        }
                    ]);

                if (error) throw error;

                // Redirection directe vers la page de profil générée
                window.location.href = `profile.html?p=${slug}`;

            } catch (err) {
                console.error("Erreur lors de l'enregistrement:", err);
                alert("Une erreur est survenue lors de l'enregistrement. Veuillez réessayer.");
                btn.disabled = false;
                btn.textContent = "Générer mon Profil & Enregistrer ma Carte →";
            }
        }

        // TRIPLE CLIC SECRET SUR LE POINT DU FOOTER
        let clickCount = 0;
        let clickTimer = null;
        function handleSecretAdmin() {
            clickCount++;
            clearTimeout(clickTimer);
            if (clickCount >= 3) {
                window.location.href = 'login.html';
                clickCount = 0;
            }
            clickTimer = setTimeout(() => { clickCount = 0; }, 1000);
        }
    </script>
</body>
</html>
