<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision Tap — Vos Informations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-body: #FFFFFF; --bg-surface: #F8FAFC; --bg-card: #FFFFFF;
            --primary: #FF7A00; --primary-gradient: linear-gradient(135deg, #FF9432 0%, #FF7A00 50%, #E05300 100%);
            --primary-glow-strong: rgba(255, 122, 0, 0.25); --primary-glow: rgba(255, 122, 0, 0.12);
            --text-main: #0F172A; --text-secondary: #475569; --text-muted: #94A3B8;
            --border-subtle: #E2E8F0; --border-hover: rgba(255, 122, 0, 0.4);
            --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px; --radius-xl: 28px;
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }
        .ambient-glow { position: fixed; top: -150px; left: 50%; transform: translateX(-50%); width: 750px; height: 450px; background: radial-gradient(circle, rgba(255, 122, 0, 0.08) 0%, rgba(255, 255, 255, 0) 70%); z-index: 0; pointer-events: none; }
        header { position: sticky; top: 0; z-index: 100; width: 100%; padding: 16px 24px; backdrop-filter: blur(16px); background: rgba(255, 255, 255, 0.85); border-bottom: 1px solid var(--border-subtle); }
        .nav-container { max-width: 1240px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text-main); font-weight: 800; font-size: 1.15rem; }
        .logo-symbol { width: 32px; height: 32px; border-radius: 10px; background: var(--primary-gradient); display: grid; place-items: center; box-shadow: 0 4px 12px var(--primary-glow-strong); }
        .form-hero { padding: 40px 24px 10px; text-align: center; max-width: 780px; margin: 0 auto; }
        .badge-pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: rgba(255, 122, 0, 0.1); border: 1px solid rgba(255, 122, 0, 0.2); color: var(--primary); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 16px; }
        .form-wrapper { max-width: 820px; width: 100%; margin: 0 auto 60px; padding: 20px 24px; z-index: 1; }
        .template-options-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
        .template-option-pill { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 14px; cursor: pointer; transition: var(--transition); }
        .template-option-pill.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
        .form-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 36px 32px; box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.05); display: flex; flex-direction: column; gap: 32px; }
        .form-section-title { font-size: 1.15rem; font-weight: 800; border-bottom: 1px solid var(--border-subtle); padding-bottom: 8px; margin-bottom: 16px; }
        .input-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group.full-width { grid-column: span 2; }
        label { font-size: 0.85rem; font-weight: 600; }
        input, textarea { width: 100%; padding: 12px 16px; background: #F8FAFC; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font-family: inherit; font-size: 0.92rem; outline: none; }
        input:focus, textarea:focus { border-color: var(--primary); background: #fff; }
        .btn-continue { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: var(--primary-gradient); color: #FFFFFF; font-size: 0.92rem; font-weight: 700; border-radius: 999px; border: none; cursor: pointer; box-shadow: 0 4px 14px var(--primary-glow-strong); }
        .btn-back { display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; background: rgba(15, 23, 42, 0.04); border: 1px solid var(--border-subtle); border-radius: 999px; color: var(--text-main); font-size: 0.9rem; font-weight: 600; text-decoration: none; }
        .form-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-subtle); padding-top: 20px; }
        footer { margin-top: auto; border-top: 1px solid var(--border-subtle); background: #F8FAFC; padding: 30px; text-align: center; }
        @media(max-width: 768px){ .input-grid, .template-options-grid { grid-template-columns: 1fr; } .input-group.full-width { grid-column: auto; } }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>
    <header>
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-symbol"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5"><path d="M6 2L18 8L6 14L18 20L6 26"/><path d="M2 10h.01"/><path d="M2 14h.01"/></svg></div>
                <span>Vision Tap</span>
            </a>
            <a href="admin.html" style="text-decoration:none; color:var(--text-main); font-weight:600; font-size:0.9rem;">Admin</a>
        </div>
    </header>

    <main class="form-wrapper">
        <div class="form-hero">
            <div class="badge-pill">Profil NFC Cloud</div>
            <h1>Remplissez votre profil</h1>
        </div>

        <div class="template-options-grid">
            <div class="template-option-pill" data-tpl="business" onclick="setTemplate('business')"><strong>Business</strong><p style="font-size:0.75rem; color:#64748B;">Minimal & vCard</p></div>
            <div class="template-option-pill active" data-tpl="professional" onclick="setTemplate('professional')"><strong>Professional</strong><p style="font-size:0.75rem; color:#64748B;">Grille d'actions</p></div>
            <div class="template-option-pill" data-tpl="creator" onclick="setTemplate('creator')"><strong>Creator</strong><p style="font-size:0.75rem; color:#64748B;">Style Link-in-Bio</p></div>
        </div>

        <form id="vt-profile-form" class="form-card" onsubmit="saveToSupabase(event)">
            <div>
                <h2 class="form-section-title">01. Identité</h2>
                <div class="input-grid">
                    <div class="input-group full-width"><label>URL Photo / Avatar</label><input type="url" id="photo" placeholder="https://example.com/photo.jpg"></div>
                    <div class="input-group"><label>Nom Complet *</label><input type="text" id="name" placeholder="Ex: Walid Kaddouri" required></div>
                    <div class="input-group"><label>Titre / Profession *</label><input type="text" id="profession" placeholder="Ex: Directeur Commercial" required></div>
                    <div class="input-group full-width"><label>Entreprise</label><input type="text" id="company" placeholder="Ex: Vision Tap"></div>
                    <div class="input-group full-width"><label>Biographie</label><textarea id="description" placeholder="Présentation rapide..."></textarea></div>
                </div>
            </div>

            <div>
                <h2 class="form-section-title">02. Coordonnées & Réseaux</h2>
                <div class="input-grid">
                    <div class="input-group"><label>Téléphone *</label><input type="tel" id="phone" placeholder="+212 6 00 00 00 00" required></div>
                    <div class="input-group"><label>WhatsApp</label><input type="tel" id="whatsapp" placeholder="+212 6 00 00 00 00"></div>
                    <div class="input-group"><label>Email *</label><input type="email" id="email" placeholder="contact@domaine.com" required></div>
                    <div class="input-group"><label>Ville / Adresse</label><input type="text" id="address" placeholder="Casablanca, Maroc"></div>
                    <div class="input-group"><label>Site Web</label><input type="url" id="website" placeholder="https://monsite.com"></div>
                    <div class="input-group"><label>LinkedIn</label><input type="url" id="linkedin" placeholder="https://linkedin.com/in/profil"></div>
                    <div class="input-group"><label>Instagram</label><input type="url" id="instagram" placeholder="https://instagram.com/compte"></div>
                    <div class="input-group"><label>Lien Calendrier (Calendly)</label><input type="url" id="booking" placeholder="https://calendly.com/..."></div>
                </div>
            </div>

            <div class="form-actions">
                <a href="templates.html" class="btn-back">Retour</a>
                <button type="submit" id="submit-btn" class="btn-continue">Prévisualiser & Enregistrer</button>
            </div>
        </form>
    </main>

    <footer><p>&copy; 2026 Vision Tap</p></footer>

    <script>
        // Configuration Supabase
        const SUPABASE_URL = "https://vbywltvaiqvixjdiztkr.supabase.co";
        const SUPABASE_KEY = "sb_publishable_eKDcZHQoK8y8l4wbrGeApA_w5-Wc6Vx";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let selectedTemplate = localStorage.getItem('selectedTemplate') || 'professional';

        function setTemplate(tpl) {
            selectedTemplate = tpl;
            document.querySelectorAll('.template-option-pill').forEach(el => el.classList.remove('active'));
            document.querySelector(`[data-tpl="${tpl}"]`).classList.add('active');
        }

        async function saveToSupabase(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.textContent = "Sauvegarde en cours...";
            btn.disabled = true;

            const nameVal = document.getElementById('name').value.trim();
            const slugVal = nameVal.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, '_') + '_' + Math.floor(Math.random() * 1000);

            const profileData = {
                slug: slugVal,
                name: nameVal,
                profession: document.getElementById('profession').value.trim(),
                company: document.getElementById('company').value.trim(),
                description: document.getElementById('description').value.trim(),
                photo: document.getElementById('photo').value.trim(),
                phone: document.getElementById('phone').value.trim(),
                whatsapp: document.getElementById('whatsapp').value.trim(),
                email: document.getElementById('email').value.trim(),
                address: document.getElementById('address').value.trim(),
                website: document.getElementById('website').value.trim(),
                linkedin: document.getElementById('linkedin').value.trim(),
                instagram: document.getElementById('instagram').value.trim(),
                booking: document.getElementById('booking').value.trim(),
                template: selectedTemplate
            };

            // Sauvegarde Cloud Supabase
            const { data, error } = await supabase.from('profiles').insert([profileData]).select();

            if (error) {
                console.error("Erreur Supabase:", error);
                // Fallback local en cas de problème de connexion
                localStorage.setItem('profileData', JSON.stringify(profileData));
                localStorage.setItem('selectedTemplate', selectedTemplate);
                window.location.href = `preview.html?p=${slugVal}`;
            } else {
                localStorage.setItem('profileData', JSON.stringify(profileData));
                localStorage.setItem('selectedTemplate', selectedTemplate);
                window.location.href = `preview.html?p=${slugVal}`;
            }
        }
    </script>
</body>
</html>
